[logging]
level = "debug"
error_separate = false

[library]
class = "AIX"
model_file = "../mini_app/train_models/model_a/watercnn_cuda.pt"
batchsize = 100000
communication_mode = "collective"

[normalization]
class = "MinMax"
input_min = 0.0
input_max = 1.0
output_min = 0.0
output_max = 1.0

[behavior]
class = "Default"

[application]
class = "MLCouplingApplicationBenchmark"
